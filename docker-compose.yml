services:
  rescuenet-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: rescuenet-x:latest
    container_name: rescuenet-x
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
    volumes:
      - data-volume:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  data-volume:
