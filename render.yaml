services:
  - type: web
    name: rescuenet-x
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_PATH
        value: /tmp/rescuenet.db
      - key: DEMO_MODE
        value: "true"
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
